services:
  frontend:
    build: ./frontend
    image: my_party_frontend
    container_name: my_party_dev
    # صلاحيات مخففة: نستخدم devices و group_add بدلاً من privileged
    privileged: false
    group_add:
      - plugdev          # يسمح بالوصول إلى أجهزة USB بدون صلاحيات root مطلقة
    devices:
      - /dev/bus/usb:/dev/bus/usb
    # لا حاجة لشبكة المضيف إذا كنا نعمل عبر USB فقط
    network_mode: host
    volumes:
      - ./frontend:/app
      # تركيب مجلد خاص بذاكرة التخزين المؤقت لـ Flutter و Pub لتفادي إعادة التحميل كل مرة
      - flutter_pub_cache:/opt/flutter/.pub-cache
      - flutter_build_cache:/app/build
    environment:
      - DEBIAN_FRONTEND=noninteractive
    stdin_open: true
    tty: true
    command: bash /app/start.sh

  db:
    image: mysql:8.0
    container_name: my_party_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: my_party_4
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/database_3.sql:/docker-entrypoint-initdb.d/1-init.sql
    command: --default-authentication-plugin=mysql_native_password

  backend:
    build: ./backend
    image: my_party_backend
    container_name: my_party_backend_dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/uploads:/app/uploads
      - ./backend/temp_uploads:/app/temp_uploads
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
    depends_on:
      - db

volumes:
  flutter_pub_cache:
  flutter_build_cache:
  backend_node_modules:
  db_data:
